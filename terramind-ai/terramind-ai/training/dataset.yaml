# YOLO dataset definition for TerraMind AI.
# Folder layout:
#   datasets/terramind/images/{train,val,test}/*.png
#   datasets/terramind/labels/{train,val,test}/*.txt   (YOLO format: class cx cy w h, normalised)
path: datasets/terramind
train: images/train
val: images/val
test: images/test

names:
  0: forest_clearing
  1: logging_road
  2: algal_bloom
  3: turbid_plume
  4: tailings_pond
  5: open_pit
  6: waste_dump
  7: erosion_gully
  8: burn_scar
  9: dry_riverbed
